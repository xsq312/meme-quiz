<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梗王冲浪挑战 V2.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#7c3aed;--purple-dark:#4c1d95;--pink:#ec4899;--orange:#f97316;
  --green:#22c55e;--red:#ef4444;--yellow:#fbbf24;--bg:#1a1033;--card:#2d1b52;--text:#f3e8ff;
  --text-dim:#c4b5fd;--radius:16px;
}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#0f0a1f;color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;overflow-x:hidden;
}
#app{
  width:100%;max-width:480px;min-height:100vh;position:relative;
  background:linear-gradient(180deg,#2d1b52 0%,#1a1033 60%,#120b26 100%);
  box-shadow:0 0 40px rgba(124,58,237,.3);overflow-x:hidden;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.screen{display:none;width:100%;min-height:100vh;padding:16px;animation:fadeIn .3s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* 通用按钮 */
.btn{
  display:block;width:100%;padding:14px 18px;border:none;border-radius:var(--radius);
  font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  box-shadow:0 6px 18px rgba(124,58,237,.4);transition:transform .12s;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:linear-gradient(135deg,#475569,#64748b)}
.btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.btn.orange{background:linear-gradient(135deg,var(--orange),#fbbf24)}
.btn.green{background:linear-gradient(135deg,var(--green),#16a34a)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 顶部栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar .title{font-size:20px;font-weight:800}
.coin-box{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:20px;font-weight:700}
.coin-box img{width:20px;height:20px}
/* 启动页 */
#screen-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#screen-splash img.hero{width:100%;border-radius:20px;margin-bottom:20px}
#screen-splash h1{font-size:30px;font-weight:900;margin-bottom:10px;background:linear-gradient(90deg,#fbbf24,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
#screen-splash p{color:var(--text-dim);margin-bottom:28px;line-height:1.6}
/* 大厅入口卡片 */
.menu-card{
  position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
}
.menu-card img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.menu-card .mask{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75));display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.menu-card .mask h3{font-size:20px;font-weight:800;margin-bottom:4px}
.menu-card .mask p{font-size:13px;color:var(--text-dim)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
/* 段位信息条 */
.rank-bar{background:rgba(255,255,255,.08);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.rank-bar img.badge{width:56px;height:56px;border-radius:14px}
.rank-bar .info{flex:1;min-width:0}
.rank-bar .rank-name{font-weight:800;font-size:16px}
.rank-bar .stars{color:#fbbf24;font-size:14px;margin-top:2px}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:6px;margin-top:6px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:6px;transition:width .3s}
/* 答题页 */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;gap:10px}
.quiz-head .hp{color:var(--red)}
.quiz-head .timer{font-variant-numeric:tabular-nums}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:var(--text);border-radius:12px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.timer-bar{height:6px;background:rgba(255,255,255,.15);border-radius:6px;margin-bottom:16px;overflow:hidden}
.timer-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--orange));border-radius:6px}
.question{font-size:18px;line-height:1.7;margin-bottom:20px;font-weight:600;min-height:80px}
.option{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:var(--radius);
  color:var(--text);font-size:16px;cursor:pointer;transition:all .15s;
}
.option:active{transform:scale(.98)}
.option.correct{background:rgba(34,197,94,.25);border-color:var(--green)}
.option.wrong{background:rgba(239,68,68,.25);border-color:var(--red)}
.option.disabled{pointer-events:none;opacity:.7}
.option .tag{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:rgba(255,255,255,.15);margin-right:10px;font-weight:800}
.quiz-tools{display:flex;gap:10px;margin-top:8px}
.tool-btn{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:var(--text-dim);font-size:13px;cursor:pointer}
.tool-btn:disabled{opacity:.4}
/* 连击横幅 */
.combo-banner{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:60;font-size:30px;font-weight:900;color:#fbbf24;text-shadow:0 2px 12px rgba(236,72,153,.7);pointer-events:none;animation:pop .4s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
/* 反馈弹层 */
.feedback{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.feedback.active{display:flex}
.feedback .fb-card{background:var(--card);border-radius:24px;padding:24px;text-align:center;max-width:320px;width:100%}
.feedback img{width:140px;height:140px;object-fit:contain;margin-bottom:14px}
.feedback .fb-title{font-size:22px;font-weight:900;margin-bottom:8px}
.feedback .fb-desc{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:16px}
/* 结算页 */
.result-card{background:rgba(255,255,255,.08);border-radius:24px;padding:24px;text-align:center;margin-bottom:16px}
.result-card img{width:160px;height:160px;object-fit:contain;margin-bottom:14px}
.result-card h2{font-size:26px;font-weight:900;margin-bottom:8px}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.result-stats .stat{background:rgba(255,255,255,.08);border-radius:14px;padding:12px}
.result-stats .num{font-size:22px;font-weight:900;color:#fbbf24}
.result-stats .lbl{font-size:12px;color:var(--text-dim);margin-top:2px}
/* 浓度测试结果卡 */
.conc-card{border-radius:24px;overflow:hidden;margin-bottom:16px}
.conc-card .conc-img{width:100%;aspect-ratio:3/4;object-fit:cover}
.conc-card .conc-body{padding:20px;text-align:center}
.conc-card .conc-num{font-size:40px;font-weight:900;color:#fbbf24}
.conc-card .conc-rank{font-size:20px;font-weight:800;margin:6px 0}
.conc-card .conc-tag{color:var(--text-dim);font-size:14px;line-height:1.7}
/* 列表页 */
.list-item{background:rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:10px}
.list-item .q{font-weight:600;margin-bottom:6px;line-height:1.6}
.list-item .a{color:var(--green);font-size:14px;margin-bottom:4px}
.list-item .exp{color:var(--text-dim);font-size:13px;line-height:1.6}
.empty-tip{text-align:center;color:var(--text-dim);padding:40px 20px;line-height:1.8}
/* 商城 */
.shop-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.shop-tab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.08);font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text-dim)}
.shop-tab.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.shop-item{background:rgba(255,255,255,.08);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.shop-item img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.shop-item .si-info{flex:1;min-width:0}
.shop-item .si-name{font-weight:700;margin-bottom:2px}
.shop-item .si-desc{font-size:12px;color:var(--text-dim);line-height:1.5}
.shop-item .si-btn{flex-shrink:0;padding:8px 12px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
.si-btn.buy{background:linear-gradient(135deg,var(--orange),#fbbf24)}
.si-btn.equip{background:linear-gradient(135deg,var(--green),#16a34a)}
.si-btn.equipped{background:rgba(255,255,255,.15);color:var(--text-dim)}
.si-btn.lock{background:#475569}
/* 个人主页装扮 */
.profile-head{background:rgba(255,255,255,.08);border-radius:24px;padding:22px;text-align:center;margin-bottom:16px;position:relative}
.avatar-wrap{width:96px;height:96px;margin:0 auto 10px;border-radius:24px;overflow:hidden;position:relative;border:2px solid var(--yellow)}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.profile-title{font-size:18px;font-weight:800;color:var(--yellow)}
.profile-sub{color:var(--text-dim);font-size:13px;margin-top:4px}
/* 底部导航 */
.tabbar{position:sticky;bottom:0;display:flex;background:rgba(20,12,40,.95);border-top:1px solid rgba(255,255,255,.1);padding:8px 4px;gap:2px;z-index:20}
.tabbar .tab{flex:1;text-align:center;font-size:11px;color:var(--text-dim);cursor:pointer;padding:6px 0;min-width:0}
.tabbar .tab.active{color:#fbbf24}
.tabbar .tab .ico{font-size:19px;display:block;margin-bottom:2px}
.hidden{display:none!important}
/* ===== 新增：输入框 / 弹窗 / 房间 / 指引 / 开关 ===== */
.text-input{
  width:100%;padding:14px 16px;border-radius:var(--radius);border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:var(--text);font-size:17px;outline:none;text-align:center;
}
.text-input::placeholder{color:var(--text-dim)}
.text-input:focus{border-color:var(--pink)}
.code-input{letter-spacing:8px;font-size:24px;font-weight:800;text-align:center}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal-card{background:var(--card);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal-card h2{font-size:22px;font-weight:900;margin-bottom:10px}
.modal-card p{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:16px}
.room-code{font-size:34px;font-weight:900;letter-spacing:10px;color:var(--yellow);margin:10px 0;user-select:all}
.vs-room-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.player-chip{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:12px;text-align:center}
.player-chip .p-name{font-weight:800;font-size:15px;margin-bottom:4px}
.player-chip .p-score{font-size:22px;font-weight:900;color:var(--yellow)}
.vs-vs{font-size:20px;font-weight:900;color:var(--pink)}
/* 开关 */
.switch-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:10px}
.switch-row .sw-info{text-align:left}
.switch-row .sw-name{font-weight:700;margin-bottom:2px}
.switch-row .sw-desc{font-size:12px;color:var(--text-dim)}
.switch{position:relative;width:52px;height:30px;border-radius:16px;background:rgba(255,255,255,.18);cursor:pointer;transition:background .2s;flex-shrink:0}
.switch.on{background:linear-gradient(135deg,var(--green),#16a34a)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on::after{transform:translateX(22px)}
/* 新手指引蒙层 */
.guide-mask{position:fixed;inset:0;z-index:90;pointer-events:auto}
.guide-highlight{position:fixed;border:2px solid var(--yellow);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);z-index:91;pointer-events:none}
.guide-card{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;width:calc(100% - 48px);max-width:380px;background:var(--card);border-radius:20px;padding:18px;z-index:92;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.guide-card .g-title{font-size:18px;font-weight:900;margin-bottom:6px;color:var(--yellow)}
.guide-card .g-desc{font-size:14px;color:var(--text-dim);line-height:1.6;margin-bottom:14px}
.guide-card .g-btns{display:flex;gap:10px}
.guide-card .g-btns .btn{margin:0}
.guide-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.guide-dots .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.guide-dots .dot.active{background:var(--yellow)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-action{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.name-tag{font-size:13px;color:var(--text-dim)}
.name-tag b{color:var(--yellow)}
/* 选关网格 */
.camp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.camp-cell{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;border:1.5px solid transparent}
.camp-cell.open{border-color:var(--purple)}
.camp-cell.done{background:linear-gradient(135deg,rgba(34,197,93,.25),rgba(16,185,129,.15));border-color:var(--green)}
.camp-cell.lock{opacity:.4;cursor:not-allowed}
.cc-num{font-weight:900;font-size:17px}
.cc-best{font-size:10px;color:var(--text-dim);margin-top:3px}
/* 排行榜 */
.board{display:flex;flex-direction:column;gap:8px}
.board-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.board-row.me{background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(236,72,153,.15));border:1.5px solid var(--yellow)}
.br-rank{width:34px;font-weight:900;color:var(--yellow);text-align:center}
.br-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-meta{color:var(--text-dim);font-size:13px}
@media(min-width:500px){
  body{padding:20px 0}
  #app{border-radius:24px;min-height:calc(100vh - 40px)}
}
</style>
</head>

  coins: 100, stars: 0, level: 1, combo: 0,
  encyclopedia: {}, lastCheckin: "",

  tools: {exclude:0, delay:0},

  nickname: "", lastRename: 0,
  soundOn: true, bgmOn: true, guided: false,
  campBestTime: null, vsBestTime: null, friendBestTime: null, circleBestTime: {},
  campPassed: {}, campLevelBest: {}, campTotalBest: null
};
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem("memeQuizStateV2");
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = Object.assign({}, DEFAULT_STATE, parsed);
      merged.tools = Object.assign({exclude:0,delay:0}, parsed.tools);
      merged.encyclopedia = parsed.encyclopedia||{};
      merged.framesOwned = parsed.framesOwned||["default"];
      merged.titlesOwned = parsed.titlesOwned||["none"];
      merged.circlesUnlocked = parsed.circlesUnlocked||["通用"];
      merged.circleBest = parsed.circleBest||{};
      merged.nickname = parsed.nickname||"";
      merged.lastRename = parsed.lastRename||0;
      merged.soundOn = parsed.soundOn!==false;
      merged.bgmOn = parsed.bgmOn!==false;
      merged.guided = parsed.guided===true;
      merged.campPassed = parsed.campPassed||{};
      merged.campLevelBest = parsed.campLevelBest||{};
      // 旧版本无选关进度：按 level 补推已过关，避免老玩家全部被锁
      if(!parsed.campPassed || Object.keys(parsed.campPassed).length===0){
        merged.campPassed={};
        for(let k=1;k<(parsed.level||1);k++){ merged.campPassed[k]=true; }
      }
      merged.campTotalBest = parsed.campTotalBest==null?null:parsed.campTotalBest;
      merged.campBestTime = parsed.campBestTime==null?null:parsed.campBestTime;
      merged.vsBestTime = parsed.vsBestTime==null?null:parsed.vsBestTime;
      merged.friendBestTime = parsed.friendBestTime==null?null:parsed.friendBestTime;
      merged.circleBestTime = parsed.circleBestTime||{};
      return merged;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 打乱单题选项顺序并重映射答案位置，避免答案固定在 A
function shuffleQuestion(q){
  const order=shuffle([0,1,2,3]);
  const options=order.map(i=>q.options[i]);
  const ans=order.indexOf(q.ans);
  const orig=(typeof q._oi==="number")?QUESTIONS[q._oi]:(QUESTIONS.includes(q)?q:null);
  const oi=orig?QUESTIONS.indexOf(orig):-1;
  return {diff:q.diff,cat:q.cat,q:q.q,options,ans,exp:q.exp,_oi:oi};
}
function pick(arr,n){ if(arr.length<=n) return shuffle(arr); return shuffle(arr).slice(0,n); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ==================== 音效 / BGM 引擎（Web Audio 合成） ==================== */
let AudioCtx=null, bgmTimer=null, bgmStep=0, masterGain=null;
function ac(){
  if(!AudioCtx){
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      AudioCtx=new Ctx();
      masterGain=AudioCtx.createGain();
      masterGain.gain.value=0.9;
      masterGain.connect(AudioCtx.destination);
    }catch(e){}
  }
  if(AudioCtx && AudioCtx.state==="suspended"){ AudioCtx.resume(); }
  return AudioCtx;
}
function tone(freq, dur, type, vol, when=0){
  if(!state.soundOn) return;
  const ctx=ac(); if(!ctx) return;
  try{
    const t=ctx.currentTime+when;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(masterGain||ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const SFX={
  click(){ tone(660,0.08,"triangle",0.22); },
  ok(){ tone(523,0.13,"triangle",0.3); tone(784,0.18,"triangle",0.3,0.09); },
  no(){ tone(220,0.22,"sawtooth",0.22); tone(160,0.24,"sawtooth",0.22,0.1); },
  combo(){ tone(660,0.1,"square",0.22); tone(880,0.1,"square",0.22,0.08); tone(1175,0.18,"square",0.22,0.16); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.2,"triangle",0.26,i*0.11)); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,0.22,"sawtooth",0.18,i*0.13)); },
  coin(){ tone(988,0.09,"square",0.22); tone(1319,0.16,"square",0.22,0.07); },
  door(){ tone(440,0.12,"sine",0.22); tone(554,0.12,"sine",0.22,0.1); },
  record(){ [784,988,1175,1568].forEach((f,i)=>tone(f,0.16,"triangle",0.26,i*0.09)); }
};
// 轻快循环 BGM：C 大调分解和弦 + 低音，交替进行
const BGM_NOTES=[262,330,392,523,392,330,294,349,262,330,392,494,392,330,294,247];
function bgmTick(){
  if(!state.bgmOn) return;
  const ctx=ac(); if(!ctx) return;
  try{
    const t=ctx.currentTime;
    const f=BGM_NOTES[bgmStep%BGM_NOTES.length];
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.14,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g); g.connect(masterGain||ctx.destination); o.start(t); o.stop(t+0.3);
    if(bgmStep%4===0){
      const b=ctx.createOscillator(), bg=ctx.createGain();
      b.type="triangle"; b.frequency.setValueAtTime(f/2,t);
      bg.gain.setValueAtTime(0.0001,t);
      bg.gain.exponentialRampToValueAtTime(0.12,t+0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      b.connect(bg); bg.connect(masterGain||ctx.destination); b.start(t); b.stop(t+0.42);
    }
    bgmStep++;
  }catch(e){}
}
function startBGM(){
  stopBGM();
  if(!state.bgmOn) return;
  bgmTimer=setInterval(bgmTick,300);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function toggleBGM(){ state.bgmOn=!state.bgmOn; saveState(); if(state.bgmOn) startBGM(); else stopBGM(); }
function toggleSound(){ state.soundOn=!state.soundOn; saveState(); if(state.soundOn) SFX.click(); }

/* ==================== 通用答题引擎 ==================== */
const QuizEngine = {
  timer:null, timeLeft:0, cur:0, questions:[], locked:false,
  cfg:{timeLimit:15, hp:3}, startTime:0, totalTime:0,
  start(questions, cfg, cb){
    this.questions=questions.map(q=>q._server?Object.assign({},q):shuffleQuestion(q));
    this.cfg=Object.assign({timeLimit:15,hp:3},cfg);
    this.cb=cb; this.cur=0; this.locked=false;
    this.startTime=Date.now(); this.totalTime=0;
    this.renderQ();
  },
  renderQ(){
    const q=this.questions[this.cur];
    if(!q){ this.cb.onFinish && this.cb.onFinish(); return; }
    this.locked=false; this.timeLeft=this.cfg.timeLimit;
    const total=this.questions.length;
    const head=this.cb.headInfo?this.cb.headInfo(this):"";
    const exitBtn=this.cb.exitBtn?this.cb.exitBtn():"";
    app.innerHTML=`
    <div class="screen active" id="screen-quiz">
      <div class="quiz-head">
        <span>${head}</span>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="timer">⏱ ${this.timeLeft}s</span>
          <span style="font-size:13px;color:var(--text-dim)">已用 ${this.totalTime}s</span>
          ${exitBtn}
        </span>
      </div>
      <div class="timer-bar"><div id="timebar" style="width:100%"></div></div>
      <div class="question">${this.cur+1}/${total}　${esc(q.q)}</div>
      <div id="opts">
        ${q.options.map((o,i)=>`<button class="option" data-i="${i}" onclick="QuizEngine.answer(${i})"><span class="tag">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}
      </div>
      <div class="quiz-tools" id="tools"></div>
    </div>`;
    this.startTimer();
    this.cb.onRenderTool && this.cb.onRenderTool(document.getElementById("tools"));
  },
  startTimer(){
    clearInterval(this.timer);
    const bar=document.getElementById("timebar");
    this.timer=setInterval(()=>{
      this.timeLeft--;
      const t=document.querySelector(".timer");
      if(t) t.textContent="⏱ "+this.timeLeft+"s";
      if(bar) bar.style.width=Math.max(0,this.timeLeft/this.cfg.timeLimit*100)+"%";
      if(this.timeLeft<=0){ this.timeout(); }
    },1000);
  },
  timeout(){ if(this.locked) return; this.locked=true; clearInterval(this.timer); this.reveal(null); },
  answer(i){ if(this.locked) return; this.locked=true; clearInterval(this.timer); this.reveal(i); },
  reveal(picked){
    const q=this.questions[this.cur];
    const correct=picked===q.ans;
    const timeUsed=this.cfg.timeLimit-this.timeLeft;
    this.totalTime+=timeUsed;
    document.querySelectorAll(".option").forEach(btn=>{
      const i=+btn.dataset.i; btn.classList.add("disabled");
      if(i===q.ans) btn.classList.add("correct");
      else if(i===picked) btn.classList.add("wrong");
    });
    const qi=q._oi!=null?q._oi:QUESTIONS.indexOf(q);
    if(qi>=0){ state.encyclopedia[qi]=true; }
    saveState();
    if(correct){ SFX.ok(); } else { SFX.no(); }
    this.cb.onAnswer && this.cb.onAnswer(correct,timeUsed,q);
    setTimeout(()=>this.next(),900);
  },
  next(){ this.cur++; if(this.cur>=this.questions.length){ clearOverlays(); this.cb.onFinish && this.cb.onFinish(); } else this.renderQ(); },
  stop(){ clearInterval(this.timer); }
};

  if(!unlocked){ alert("请先完成前面的关卡噢，宝~"); SFX.no(); return; }
  SFX.click();
  startCampaign(lv);

function startCampaign(lv){
  leaveQuiz();
  lv=lv||state.level;
  const chapter=campChapter(lv);
  const cfg=CAMPAIGN[chapter];
  const pool=QUESTIONS.filter(q=>q.diff===cfg.diff);
  camp={hp:cfg.hp,score:0,combo:0,correct:0,level:lv,qlist:pick(pool,cfg.qnum),chapter,totalTime:0,isRecord:false};
  QuizEngine.start(camp.qlist,{timeLimit:cfg.time,hp:cfg.hp},{
    headInfo:()=>`第${lv}关 · ❤ ${camp.hp}/${cfg.hp} · 已用 ${QuizEngine.totalTime}s`,
    exitBtn:()=>`<button class="icon-btn" onclick="quitCampaign()">退出</button>`,
    onAnswer(correct,timeUsed,q){
      state.totalPlayed++;
      if(correct){
        state.totalCorrect++; camp.combo++; camp.correct++;
        const speed=Math.round(timeUsed/cfg.time*50);
        let gain=100+Math.max(0,50-speed);
        if(camp.combo>=3) gain=Math.round(gain*(1+Math.min(camp.combo-2,5)*0.1));
        camp.score+=gain;
        state.coins+=Math.round(gain/20);
        saveState(); vibrate(30);
        if(camp.combo>=3){ comboBanner("🔥 连对 "+camp.combo+" 题！"); }
        const emo=camp.combo>=3?ASSET.emoCombo:ASSET.emoOk;
        showFeedback({img:rand(emo),title:camp.combo>=3?`${camp.combo}连击！${rand(OK_TITLES)}`:rand(OK_TITLES),
          desc:`+${gain}分　解析：${q.exp}`,cb:""});
      }else{
        camp.combo=0; camp.hp--; saveState(); vibrate([40,30,40]);
        showFeedback({img:rand(ASSET.emoNo),title:rand(NO_TITLES),
          desc:`正确答案：${q.options[q.ans]}。${q.exp}`,cb:""});
        if(camp.hp<=0){ QuizEngine.stop(); setTimeout(()=>{ clearOverlays(); campFail(); },1000); }
      }
    },
    onFinish(){ campWin(); }
  });
}
function quitCampaign(){
  if(!confirm("确定要退出本局闯关吗？当前进度不会保存哦~")) return;
  leaveQuiz(); renderCampaign();
}
function campWin(){
  SFX.win();
  const allCorrect=camp.correct===camp.qlist.length;
  camp.totalTime=Math.round(QuizEngine.totalTime);
  // 单关全对最佳用时
  let newRecord=false;
  if(allCorrect){
    const prev=state.campLevelBest[camp.level];
    if(prev==null||camp.totalTime<prev){ state.campLevelBest[camp.level]=camp.totalTime; newRecord=true; }
    state.campPassed[camp.level]=true;
    if(state.level<camp.level+1) state.level=Math.min(CAMP_TOTAL_LEVEL,camp.level+1);
  }
  // 全 30 关全对总用时纪录：仅当 30 关全部通过时累计最佳
  const passedCount=Object.keys(state.campPassed).filter(k=>state.campPassed[k]).length;
  if(passedCount>=CAMP_TOTAL_LEVEL){
    const total=Object.values(state.campLevelBest).reduce((a,b)=>a+b,0);
    if(state.campTotalBest==null||total<state.campTotalBest){ state.campTotalBest=total; }
  }
  const reward=30+camp.correct*5;
  state.coins+=reward; camp.isRecord=newRecord;
  saveState(); QuizEngine.stop();
  app.innerHTML=`
  <div class="screen active">
    <div class="result-card">
      <img onerror="this.style.visibility='hidden'" src="${ASSET.win}">
      <h2>闯关成功！泰裤辣！</h2>
      ${newRecord?`<div style="color:var(--yellow);font-weight:800;margin:6px 0">🏆 破个人纪录！本关全对用时 ${fmtTime(camp.totalTime)}</div>`:""}
      <div class="result-stats">
        <div class="stat"><div class="num">${camp.correct}/${camp.qlist.length}</div><div class="lbl">答对题数</div></div>
        <div class="stat"><div class="num">${fmtTime(camp.totalTime)}</div><div class="lbl">本局用时</div></div>
        <div class="stat"><div class="num">+${reward}</div><div class="lbl">金币奖励</div></div>
      </div>
      <p style="color:var(--text-dim)">${allCorrect?`本关最佳：${fmtTime(state.campLevelBest[camp.level])}`:"本题未全对，不计入全对用时纪录"}</p>
    </div>
    <button class="btn" onclick="renderCampaign()">返回选关</button>
    <button class="btn ghost" style="margin-top:12px" onclick="startCampaign(${Math.min(CAMP_TOTAL_LEVEL,camp.level+1)})">下一关</button>
    <button class="btn ghost" style="margin-top:12px" onclick="renderLobby()">返回大厅</button>
  </div>`;
}
function campFail(){

/* ==================== 1v1 对战 ==================== */
const VS={qnum:8,time:10,me:{score:0,correct:0},ai:{score:0,correct:0},qlist:[],tools:{exclude:0,delay:0},aiCorrectRate:0.6,aiTime:10,surrender:false,totalTime:0,isRecord:false};

function startVS(){
  leaveQuiz();
  const ri=getRankIndex();
  VS.aiCorrectRate=0.55+ri*0.09;
  VS.aiTime=Math.max(4,11-ri*1.4);
  VS.me={score:0,correct:0}; VS.ai={score:0,correct:0};
  VS.tools={exclude:state.tools.exclude>0?1:0, delay:state.tools.delay>0?1:0};
  VS.surrender=false; VS.totalTime=0; VS.isRecord=false;
  const easy=pick(QUESTIONS.filter(q=>q.diff==="easy"),3);
  const mid=pick(QUESTIONS.filter(q=>q.diff==="mid"),3);
  const hell=pick(QUESTIONS.filter(q=>q.diff==="hell"),2);
  VS.qlist=shuffle(easy.concat(mid,hell));
  app.innerHTML=`
  <div class="screen active">
    <div class="result-card">
      <img onerror="this.style.visibility='hidden'" src="${ASSET.vs}">
      <h2>匹配对手中…</h2>
      <p style="color:var(--text-dim)">正在为你寻找同段位冲浪选手</p>
    </div>
  </div>`;
  setTimeout(()=>{
    QuizEngine.start(VS.qlist,{timeLimit:VS.time,hp:99},{
      headInfo:()=>`我 ${VS.me.score} : ${VS.ai.score} 对手 · 已用 ${QuizEngine.totalTime}s`,
      exitBtn:()=>`<button class="icon-btn" style="color:var(--red)" onclick="vsSurrender()">投降</button>`,
      onRenderTool(box){
        box.innerHTML=`
          <button class="tool-btn" ${VS.tools.exclude?"":"disabled"} onclick="vsUseExclude()">✂ 排除错误项(${state.tools.exclude})</button>
          <button class="tool-btn" ${VS.tools.delay?"":"disabled"} onclick="vsUseDelay()">⏳ 延时3秒(${state.tools.delay})</button>`;
      },
      onAnswer(correct,timeUsed,q){
        state.totalPlayed++;
        if(correct){
          state.totalCorrect++; VS.me.correct++;
          const speed=Math.round(timeUsed/VS.time*50);
          VS.me.score+=100+Math.max(0,50-speed);
        }
        const aiCorrect=Math.random()<VS.aiCorrectRate;
        const aiTime=VS.aiTime*(0.8+Math.random()*0.4);
        if(aiCorrect){ VS.ai.correct++; VS.ai.score+=100+Math.max(0,Math.round((1-aiTime/VS.time)*50)); }
        saveState();
      },
      onFinish(){ vsFinish(); }
    });
  },800);
}
function vsSurrender(){
  if(!confirm("确定要投降吗？本局判负，段位星数会扣除哦~")) return;
  VS.surrender=true; leaveQuiz(); vsFinish();
}
function vsUseExclude(){
  if(!VS.tools.exclude) return;
  VS.tools.exclude=0; state.tools.exclude--;
  const q=QuizEngine.questions[QuizEngine.cur];
  const wrong=q.options.map((_,i)=>i).filter(i=>i!==q.ans);
  const hide=wrong[Math.floor(Math.random()*wrong.length)];
  const btn=document.querySelector(`.option[data-i="${hide}"]`);
  if(btn){ btn.style.visibility="hidden"; }
  saveState();
  const b=document.querySelectorAll(".tool-btn")[0]; if(b) b.disabled=true;
}
function vsUseDelay(){
  if(!VS.tools.delay) return;
  VS.tools.delay=0; state.tools.delay--;
  VS.time+=3; QuizEngine.cfg.timeLimit+=3;
  saveState();
  const b=document.querySelectorAll(".tool-btn")[1]; if(b) b.disabled=true;
}
function vsFinish(){
  QuizEngine.stop();
  const surrendered=VS.surrender;
  const win=!surrendered && VS.me.score>VS.ai.score;
  const draw=!surrendered && VS.me.score===VS.ai.score;
  VS.totalTime=Math.round(QuizEngine.totalTime);
  const allCorrect=VS.me.correct===VS.qlist.length;
  if(allCorrect){
    const prev=state.vsBestTime;
    if(prev==null||VS.totalTime<prev){ state.vsBestTime=VS.totalTime; VS.isRecord=true; }
  }
  if(win){ SFX.win(); state.stars++; state.coins+=40; state.vsWins++; }
  else if(!draw){ SFX.lose(); if(state.stars>0) state.stars--; }
  saveState();
  app.innerHTML=`
  <div class="screen active">
    <div class="result-card">
      <img onerror="this.style.visibility='hidden'" src="${win?ASSET.vsWin:ASSET.vsLose}">
      <h2>${win?"对战胜利！泰裤辣！":(draw?"势均力敌！":(surrendered?"你已投降，惜败一局…":"惜败一局…"))}</h2>
      ${VS.isRecord?`<div style="color:var(--yellow);font-weight:800;margin:6px 0">🏆 破个人纪录！全对用时 ${fmtTime(VS.totalTime)}</div>`:""}
      <div class="result-stats">
        <div class="stat"><div class="num">${VS.me.correct}</div><div class="lbl">我答对</div></div>
        <div class="stat"><div class="num">${VS.ai.correct}</div><div class="lbl">对手答对</div></div>
        <div class="stat"><div class="num">${fmtTime(VS.totalTime)}</div><div class="lbl">本局用时</div></div>
        <div class="stat"><div class="num">${win?"+1★":(draw?"±0":"-1★")}</div><div class="lbl">段位变化</div></div>
      </div>
      <p style="color:var(--text-dim)">${state.vsBestTime!=null?`全对最佳：${fmtTime(state.vsBestTime)}　`:''}当前段位：${rankName()}（${state.stars}星）</p>
    </div>
    <button class="btn" onclick="startVS()">再来一局</button>
    <button class="btn ghost" style="margin-top:12px" onclick="renderLobby()">返回大厅</button>
  </div>`;
}

/* ==================== 好友单挑（WebSocket 联机） ==================== */
// 联机后端：同目录 server.js（Node 内置 WebSocket，零依赖）。
// 页面由 server.js 托管时自动用 ws://当前主机；直接双击 file:// 打开则回退到本机 localhost:8080。
const FR={code:"",isHost:false,guestName:"",me:{score:0,correct:0},foe:{score:0,correct:0},
  qlist:[],qnum:8,time:10,phase:"lobby",totalTime:0,isRecord:false,connected:false,foeLeft:false};
let frSocket=null, frUid=localStorage.getItem("memeQuizUid")||"";
function frWsUrl(){
  if(location.protocol==="file:") return "ws://localhost:8080";
  const proto=location.protocol==="https:"?"wss://":"ws://";
  return proto+location.host;
}
function frSend(obj){ if(frSocket&&frSocket.readyState===1){ try{ frSocket.send(JSON.stringify(obj)); }catch(e){} } }
function frEnsureSocket(){
  if(frSocket&&(frSocket.readyState===0||frSocket.readyState===1)) return frSocket;
  try{ frSocket=new WebSocket(frWsUrl()); }catch(e){ frSocket=null; }
  if(!frSocket){ alert("联机服务连接失败，请确认后端已启动后再试~"); return null; }
  frSocket.onopen=()=>{ if(!frUid){ frUid=crypto.randomUUID(); localStorage.setItem("memeQuizUid",frUid); } frSend({type:"hello",uid:frUid,name:displayName()}); };
  frSocket.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } frOnMessage(m); };
  frSocket.onclose=()=>{ FR.connected=false; };
  frSocket.onerror=()=>{ FR.connected=false; };
  return frSocket;
}
function frClose(){ if(frSocket){ try{ frSocket.onclose=null; frSocket.close(); }catch(e){} frSocket=null; } FR.connected=false; }

function renderFriend(){
  leaveQuiz();
  app.innerHTML=`
  <div class="screen active" id="screen-friend">
    <div class="topbar">
      <div class="title">好友单挑</div>
      <div class="coin-box"><img onerror="this.style.visibility='hidden'" src="${ASSET.coin}">${state.coins}</div>
    </div>
    <div class="result-card">
      <img onerror="this.style.visibility='hidden'" src="${ASSET.vs}">
      <h2>建房约好友</h2>
      <p style="color:var(--text-dim)">房主生成 6 位邀请码，把码发给好友；好友输入正确码即可进房同台接梗。</p>
    </div>
    <button class="btn" onclick="createRoom()">🏠 创建房间</button>
    <div style="margin:16px 0;text-align:center;color:var(--text-dim);font-size:13px">— 或输入邀请码加入 —</div>
    <input id="joinCode" class="text-input code-input" maxlength="6" inputmode="numeric" placeholder="6 位邀请码">
    <button class="btn ghost" style="margin-top:12px" onclick="joinRoom()">🚪 加入房间</button>
    <button class="btn ghost" style="margin-top:12px" onclick="renderLobby()">返回大厅</button>
  </div>`;
}

function createRoom(){
  const s=frEnsureSocket(); if(!s) return;
  FR.phase="connecting";
  app.innerHTML=`<div class="screen active"><div class="result-card"><h2>正在创建房间…</h2><p style="color:var(--text-dim)">连接联机服务器中</p></div></div>`;
  const tryCreate=()=>{ frSend({type:"create",name:displayName()}); };
  if(s.readyState===1) tryCreate(); else s.onopen=()=>{ frSend({type:"hello",uid:frUid,name:displayName()}); tryCreate(); };
}
function joinRoom(){
  const raw=(document.getElementById("joinCode").value||"").trim();
  if(!/^\d{6}$/.test(raw)){ alert("邀请码是 6 位数字哦~"); SFX.no(); return; }
  const s=frEnsureSocket(); if(!s) return;
  FR.phase="connecting";
  app.innerHTML=`<div class="screen active"><div class="result-card"><h2>正在加入房间…</h2><p style="color:var(--text-dim)">校验邀请码中</p></div></div>`;
  const tryJoin=()=>{ frSend({type:"join",code:raw,name:displayName()}); };
  if(s.readyState===1) tryJoin(); else s.onopen=()=>{ frSend({type:"hello",uid:frUid,name:displayName()}); tryJoin(); };
}

function frOnMessage(m){
  switch(m.type){
    case "created":
      FR.code=m.code; FR.isHost=true; FR.guestName="等待好友…";
      FR.me={score:0,correct:0}; FR.foe={score:0,correct:0}; FR.connected=true; FR.foeLeft=false;
      renderRoomWait(); break;
    case "joined":
      FR.code=m.code; FR.isHost=false; FR.guestName=m.foeName||"神秘好友";
      FR.me={score:0,correct:0}; FR.foe={score:0,correct:0}; FR.connected=true; FR.foeLeft=false;
      renderRoomWait(); break;
    case "guest_joined":
      FR.guestName=m.guestName; renderRoomWait(); break;
    case "join_fail":
      alert(m.reason||"邀请码不对哦，确认一下房主发的 6 位数字吧~"); SFX.no(); renderFriend(); break;
    case "start":
      FR.qlist=m.questions.map(q=>Object.assign({},q,{_server:true})); FR.me={score:0,correct:0}; FR.foe={score:0,correct:0};
      FR.totalTime=0; FR.isRecord=false; FR.phase="quiz"; FR.foeLeft=false;
      frStartQuiz(m.hostName,m.guestName); break;
    case "score": {
      const myRole=FR.isHost?"host":"guest";
      const foeRole=myRole==="host"?"guest":"host";
      FR.me={score:m[myRole].score,correct:m[myRole].correct};
      FR.foe={score:m[foeRole].score,correct:m[foeRole].correct};
      if(FR.phase==="quiz") frRefreshScore(); break;
    }
    case "opponent_left":
      FR.foeLeft=true;
      if(FR.phase==="quiz"){ QuizEngine.stop(); friendFinish(true); }
      else { alert("好友已离开房间"); renderFriend(); }
      break;
    case "finish":
      frFinishByServer(m); break;
  }
}

  leaveQuiz();

  app.innerHTML=`

function friendStart(){

function frStartQuiz(hostName,guestName){
  leaveQuiz();
  const myRole=FR.isHost?"host":"guest";
  QuizEngine.start(FR.qlist,{timeLimit:FR.time,hp:99},{
    headInfo:()=>`${esc(displayName())} ${FR.me.score} : ${FR.foe.score} ${esc(FR.guestName||"好友")} · 已用 ${QuizEngine.totalTime}s`,
    exitBtn:()=>`<button class="icon-btn" style="color:var(--red)" onclick="friendSurrender()">投降</button>`,
    onAnswer(correct,timeUsed,q){
      state.totalPlayed++;
      if(correct) state.totalCorrect++;
      saveState();
      // 联机题选项顺序与服务端一致；答对上报正确位置，答错上报一个非正确位（服务端按 picked===q.ans 校验）
      const picked=correct?q.ans:-1;
      frSend({type:"answer", qIndex:QuizEngine.cur, picked, correct, timeUsed});
    },
    onFinish(){ /* 等待服务端 finish 汇总双方比分 */ }
  });
}
function frRefreshScore(){
  const el=document.querySelector(".quiz-head");

function friendSurrender(){

function frFinishByServer(m){

      <div class="result-stats">

/* ==================== 梗浓度测试 ==================== */

function startTest(){

  const mid=pick(QUESTIONS.filter(q=>q.diff==="mid"),12);

  TEST.qlist=shuffle(easy.concat(mid,hell));
  TEST.correct=0; TEST.totalTime=0; TEST.catStat={};
  QuizEngine.start(TEST.qlist,{timeLimit:12,hp:99},{
    headInfo:()=>`浓度测试 ${QuizEngine.cur+1}/${TEST.qlist.length}`,
    exitBtn:()=>`<button class="icon-btn" onclick="quitTest()">退出</button>`,
    onAnswer(correct,timeUsed,q){
      state.totalPlayed++; TEST.totalTime+=timeUsed;
      if(correct){ state.totalCorrect++; TEST.correct++; TEST.catStat[q.cat]=(TEST.catStat[q.cat]||0)+1; }
      saveState();
    },
    onFinish(){ testResult(); }
  });
}
function quitTest(){
  if(!confirm("确定要退出浓度测试吗？本局报告将不生成哦~")) return;
  leaveQuiz(); renderLobby();
}
function testResult(){
  QuizEngine.stop();
  const n=TEST.qlist.length;
  let conc=Math.round(TEST.correct/n*100);
  const avgTime=TEST.totalTime/n;
  let speedBonus=avgTime<=4?3:avgTime<=8?1:0;
  conc=Math.max(0,Math.min(100,conc+speedBonus));
  let tier;
  if(conc<=30) tier=0; else if(conc<=60) tier=1; else if(conc<=85) tier=2; else tier=3;
  const ranks=["2G断网选手","5G普通网民","资深冲浪达人","互联网梗神"];
  const evalTxt=[
    "冲浪信号不太稳定，多刷刷短视频补补课吧！",
    "正常网民水平，日常接梗基本够用～",
    "冲浪浓度很高，大部分梗都难不倒你！",
    "再冲浪下去就要住互联网里了，梗王实锤！"
  ];
  const topCat=Object.entries(TEST.catStat).sort((a,b)=>b[1]-a[1])[0];
  const goodCat=topCat?topCat[0]:"通用";
  TEST.totalTime=Math.round(QuizEngine.totalTime);
  state.coins+=20; saveState();
  app.innerHTML=`
  <div class="screen active">
    <div class="conc-card">
      <img onerror="this.style.visibility='hidden'" class="conc-img" src="${ASSET.conc[tier]}">
      <div class="conc-body">
        <div class="conc-num">${conc}%</div>
        <div class="conc-rank">${ranks[tier]}</div>
        <div class="conc-tag">擅长领域：${goodCat}　用时 ${fmtTime(TEST.totalTime)}<br>${evalTxt[tier]}</div>
      </div>
    </div>
    <button class="btn" onclick="shareResult(${conc},'${ranks[tier]}','${goodCat}')">生成分享图</button>
    <button class="btn ghost" style="margin-top:12px" onclick="startTest()">再测一次</button>
    <button class="btn ghost" style="margin-top:12px" onclick="renderLobby()">返回大厅</button>
  </div>`;
}
function shareResult(conc,rank,cat){
  const div=document.createElement("div");
  div.className="feedback active";
  div.innerHTML=`<div class="fb-card">
    <img onerror="this.style.visibility='hidden'" src="${ASSET.qr}">
    <div class="fb-title">${rank}</div>
    <div class="fb-desc">冲浪浓度 ${conc}%　擅长：${cat}<br>长按保存图片，分享给朋友测测吧！</div>

}

function circleEnter(cat){
  if(!state.circlesUnlocked.includes(cat)){
    if(state.coins<CIRCLE_PRICE){ alert("金币不够啦，去闯关/对战/签到赚金币吧！"); return; }
    if(!confirm(`花费 ${CIRCLE_PRICE} 金币解锁「${cat}」专场？`)) return;
    state.coins-=CIRCLE_PRICE; state.circlesUnlocked.push(cat); saveState();
  }
  leaveQuiz();
  CIRCLE.cat=cat;
  const pool=QUESTIONS.filter(q=>q.cat===cat);
  CIRCLE.qlist=pick(pool,Math.min(10,pool.length));
  CIRCLE.correct=0; CIRCLE.score=0; CIRCLE.totalTime=0; CIRCLE.isRecord=false;
  QuizEngine.start(CIRCLE.qlist,{timeLimit:12,hp:99},{
    headInfo:()=>`${esc(cat)}专场 ${QuizEngine.cur+1}/${CIRCLE.qlist.length} · 已用 ${QuizEngine.totalTime}s`,
    exitBtn:()=>`<button class="icon-btn" onclick="quitCircle()">退出</button>`,
    onAnswer(correct,timeUsed,q){
      state.totalPlayed++;
      if(correct){
        state.totalCorrect++; CIRCLE.correct++;
        const speed=Math.round(timeUsed/12*50);
        CIRCLE.score+=100+Math.max(0,50-speed);
        vibrate(30);
        showFeedback({img:rand(ASSET.emoOk),title:rand(OK_TITLES),desc:`+${100+Math.max(0,50-speed)}分　解析：${q.exp}`,cb:""});
      }else{
        vibrate([40,30,40]);
        showFeedback({img:rand(ASSET.emoNo),title:rand(NO_TITLES),desc:`正确答案：${q.options[q.ans]}。${q.exp}`,cb:""});
      }
      saveState();
    },
    onFinish(){ circleFinish(); }
  });
}
function quitCircle(){
  if(!confirm("确定要退出本圈层专场吗？")) return;
  leaveQuiz(); renderCircleList();
}
function circleFinish(){
  QuizEngine.stop();
  CIRCLE.totalTime=Math.round(QuizEngine.totalTime);
  const prev=state.circleBest[CIRCLE.cat]||0;
  if(CIRCLE.score>prev){ state.circleBest[CIRCLE.cat]=CIRCLE.score; }
  const allCorrect=CIRCLE.correct===CIRCLE.qlist.length;
  if(allCorrect){
    const pt=state.circleBestTime[CIRCLE.cat];
    if(pt==null||CIRCLE.totalTime<pt){ state.circleBestTime[CIRCLE.cat]=CIRCLE.totalTime; CIRCLE.isRecord=true; }
  }
  const reward=20+CIRCLE.correct*4;
  state.coins+=reward; saveState();
  app.innerHTML=`
  <div class="screen active">
    <div class="result-card">
      <img onerror="this.style.visibility='hidden'" src="${CIRCLE.correct>=CIRCLE.qlist.length*0.6?ASSET.win:ASSET.fail}">
      <h2>${esc(CIRCLE.cat)}专场结算</h2>
      ${CIRCLE.isRecord?`<div style="color:var(--yellow);font-weight:800;margin:6px 0">🏆 破个人纪录！全对用时 ${fmtTime(CIRCLE.totalTime)}</div>`:""}
      <div class="result-stats">
        <div class="stat"><div class="num">${CIRCLE.correct}/${CIRCLE.qlist.length}</div><div class="lbl">答对题数</div></div>
        <div class="stat"><div class="num">${fmtTime(CIRCLE.totalTime)}</div><div class="lbl">本局用时</div></div>
        <div class="stat"><div class="num">+${reward}</div><div class="lbl">金币奖励</div></div>
      </div>
      <p style="color:var(--text-dim)">历史最佳：${Math.max(prev,CIRCLE.score)} 分${state.circleBestTime[CIRCLE.cat]!=null?` · 全对最佳 ${fmtTime(state.circleBestTime[CIRCLE.cat])}`:""}</p>

    <button class="btn ghost" style="margin-top:12px" onclick="renderCircleList()">返回专场列表</button>
  </div>`;
}

      </div>`).join("");
  }else if(shopTab==="frame"){

      const owned=state.framesOwned.includes(f.id);

        <img onerror="this.style.visibility='hidden'" src="${f.icon}">

      const equipped=state.titleEquipped===t.id;
      let btn;
      if(equipped){ btn=`<button class="si-btn equipped" disabled>已佩戴</button>`; }
      else if(owned){ btn=`<button class="si-btn equip" onclick="equipTitle('${t.id}')">佩戴</button>`; }

        <img onerror="this.style.visibility='hidden'" src="${t.icon}">
        <div class="si-info"><div class="si-name">${t.name}</div><div class="si-desc">${t.desc}</div></div>

    }).join("");
  }else{
    body=CIRCLES.map(cat=>{

    </div>
    <div class="result-stats">
      <div class="stat"><div class="num">${state.totalPlayed}</div><div class="lbl">累计答题</div></div>
      <div class="stat"><div class="num">${acc}%</div><div class="lbl">正确率</div></div>
      <div class="stat"><div class="num">${Object.keys(state.encyclopedia).length}</div><div class="lbl">收集梗数</div></div>
    </div>
    <div class="list-item"><div class="q">闯关进度：第 ${state.level}/30 关</div></div>
    <div class="list-item"><div class="q">对战胜场：${state.vsWins} 场</div></div>
    <div class="list-item">
      <div class="q">个人最佳（全对用时）</div>
      <div class="exp" style="margin-top:6px">
        1v1对战：${state.vsBestTime!=null?fmtTime(state.vsBestTime):"—"}<br>
        好友单挑：${state.friendBestTime!=null?fmtTime(state.friendBestTime):"—"}<br>
        闯关通关总用时：${state.campTotalBest!=null?fmtTime(state.campTotalBest):"—"}
      </div>
    </div>
    <div class="list-item"><div class="q">金币：${state.coins}　道具：排除卡×${state.tools.exclude} 延时卡×${state.tools.delay}</div></div>
    <div class="switch-row">
      <div class="sw-info"><div class="sw-name">🔊 答题音效</div><div class="sw-desc">点击 / 答对 / 答错 / 连击 / 胜负提示音</div></div>
      <div class="switch ${state.soundOn?"on":""}" onclick="toggleSound();renderProfile()"></div>
    </div>
    <div class="switch-row">
      <div class="sw-info"><div class="sw-name">🎵 背景音乐</div><div class="sw-desc">轻松休闲的循环 BGM，可随时关闭</div></div>
      <div class="switch ${state.bgmOn?"on":""}" onclick="toggleBGM();renderProfile()"></div>
    </div>
    <button class="btn orange" style="margin-top:12px" onclick="renderShop()">换装 · 进商城</button>
    <button class="btn ghost" style="margin-top:12px" onclick="resetAll()">重置全部进度</button>
    <div class="tabbar">
      <div class="tab" onclick="renderLobby()"><span class="ico">🏠</span>大厅</div>
      <div class="tab" onclick="renderBook()"><span class="ico">📖</span>百科</div>
      <div class="tab" onclick="renderBoard()"><span class="ico">🏆</span>排行</div>
      <div class="tab" onclick="renderCheckin()"><span class="ico">📅</span>签到</div>
      <div class="tab active"><span class="ico">👤</span>我的</div>
    </div>
  </div>`;
}
function resetAll(){
  if(confirm("确定要清空所有进度、金币、装扮和收集记录吗？")){
    localStorage.removeItem("memeQuizStateV2");
    state=JSON.parse(JSON.stringify(DEFAULT_STATE));
    saveState(); stopBGM(); renderSplash();
  }
}

/* ==================== 新手指引 ==================== */
const GUIDE_STEPS=[
  {sel:".rank-bar", title:"你的身份名片", desc:"这里显示你的昵称、段位、称号和星数。答题获胜升段位，闯关和对战都能赚金币。"},
  {sel:".menu-card", title:"单人闯关", desc:"最基础的玩法：一题一题接梗闯关，答错扣血量，通关解锁更多关卡，还能拿金币。"},
  {sel:".menu-grid", title:"对战玩法", desc:"1v1对战和好友单挑都是双人 PK：答对又快又准得分更高；好友单挑建房发邀请码，约朋友同台接梗。"},
  {sel:".menu-grid", title:"圈层专场 · 商城 · 百科", desc:"圈层专场是垂直接梗；商城买道具、头像框和称号；答过的梗会自动收进梗百科。"},
  {sel:".tabbar", title:"底部导航", desc:"大厅、百科、签到、我的随时切换；每天签到领金币，昵称和装扮都在「我的」里设置。"}
];
let guideIdx=0, guideMask=null, guideHL=null, guideCard=null;
function startGuide(){
  guideIdx=0;
  guideMask=document.createElement("div"); guideMask.className="guide-mask";
  guideCard=document.createElement("div"); guideCard.className="guide-card";
  document.body.appendChild(guideMask); document.body.appendChild(guideCard);
  showGuideStep();
}
function showGuideStep(){
  const step=GUIDE_STEPS[guideIdx];
  const target=document.querySelector(step.sel);
  if(guideHL) guideHL.remove();
  guideHL=document.createElement("div"); guideHL.className="guide-highlight";
  document.body.appendChild(guideHL);
  if(target){
    const r=target.getBoundingClientRect();
    guideHL.style.left=(r.left-6)+"px"; guideHL.style.top=(r.top-6)+"px";
    guideHL.style.width=(r.width+12)+"px"; guideHL.style.height=(r.height+12)+"px";
  }else{ guideHL.style.display="none"; }
  const dots=GUIDE_STEPS.map((_,i)=>`<div class="dot ${i===guideIdx?"active":""}"></div>`).join("");
  guideCard.innerHTML=`
    <div class="guide-dots">${dots}</div>
    <div class="g-title">${step.title}</div>
    <div class="g-desc">${step.desc}</div>
    <div class="g-btns">
      <button class="btn ghost" onclick="skipGuide()">跳过</button>
      <button class="btn" onclick="nextGuide()">${guideIdx===GUIDE_STEPS.length-1?"开始冲浪":"下一步"}</button>
    </div>`;
}
function nextGuide(){
  SFX.click();
  guideIdx++;
  if(guideIdx>=GUIDE_STEPS.length){ finishGuide(); }
  else showGuideStep();
}
function skipGuide(){ SFX.click(); finishGuide(); }
function finishGuide(){
  state.guided=true; saveState();
  if(guideMask) guideMask.remove();
  if(guideHL) guideHL.remove();
  if(guideCard) guideCard.remove();
}

/* ==================== 启动 ==================== */
renderSplash();
// 首次交互解锁音频并启动 BGM
function unlockAudio(){
  if(state.bgmOn){ startBGM(); }
  document.removeEventListener("click", unlockAudio);
}
document.addEventListener("click", unlockAudio);

</script>
